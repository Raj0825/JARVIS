services:
  mongodb:
    image: mongo:7
    container_name: jarvis-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - jarvis-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: jarvis_db

  jarvis-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/jarvis_db

volumes:
  jarvis-mongo-data:
