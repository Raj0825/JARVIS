# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── MongoDB ─────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=mongodb://localhost:27017/jarvis_db
spring.data.mongodb.auto-index-creation=true

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.jarvis=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} — %msg%n

# ─── Jackson (Spring Boot 4 / Jackson 3) ────────────────────────────────────
spring.jackson.default-property-inclusion=non_null

# ─── Jarvis defaults (overridden per-user via MongoDB settings) ────────────
jarvis.default.provider=MOCK
jarvis.default.model=jarvis-mock-v1
jarvis.default.temperature=0.7
jarvis.default.system-prompt=You are Jarvis, an intelligent AI assistant created for a holographic personal assistant interface. Respond concisely and helpfully. When using tools, be precise about the action you are taking. Address the user respectfully.
jarvis.default.allow-writes=false

# ─── SSRF protection: blocked private IP prefixes ────────────────────────────
jarvis.ssrf.blocked-prefixes=10.,192.168.,172.16.,172.17.,172.18.,172.19.,172.20.,172.21.,172.22.,172.23.,172.24.,172.25.,172.26.,172.27.,172.28.,172.29.,172.30.,172.31.,127.,0.,169.254.,::1,fc00:,fe80:
jarvis.ssrf.allowed-schemes=https,http

# ─── CORS ────────────────────────────────────────────────────────────────────
jarvis.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# ─── Context window management ───────────────────────────────────────────────
jarvis.llm.max-history-messages=30
jarvis.llm.max-tool-loop-iterations=8
